<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Bemorlar daftari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF1EF; --card:#fff; --ink:#16252C; --soft:#5E7480; --rule:#D5DEDA;
  --pine:#0F5C4E; --pine-soft:#E3EFEA; --emerald:#1F9D6B;
  --amber:#B8860B; --amber-soft:#FBF1DC; --rose:#AF443E; --rose-soft:#FAE9E7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Instrument Sans',system-ui,sans-serif;font-size:15px}
.disp{font-family:'Space Grotesk',sans-serif}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
input,select,textarea,button{font-family:inherit}
input,select,textarea{width:100%;padding:9px 11px;border-radius:8px;
  border:1px solid var(--rule);background:#fff;color:var(--ink);font-size:14px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pine);outline-offset:1px}
label.lb{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);
  font-weight:600;margin-bottom:5px;display:block}
.btn{padding:9px 15px;border-radius:8px;border:1px solid var(--rule);background:#fff;
  color:var(--ink);font-size:13px;font-weight:500;cursor:pointer}
.btn-main{background:var(--pine);color:#fff;border:none;font-weight:600}
.btn-sm{padding:4px 9px;font-size:12px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
header{background:var(--card);border-bottom:1px solid var(--rule)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{padding:7px 12px;border-radius:8px;background:var(--paper);border:1px solid var(--rule);
  display:flex;align-items:baseline;gap:7px}
.chip b{font-size:17px;font-weight:600}
.chip span{font-size:12px;color:var(--soft)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px}
.qator{display:flex;gap:14px;padding:14px 16px;border-top:1px solid var(--rule);transition:background .15s}
.qator:first-child{border-top:none}
.qator:hover{background:#F7FAF9}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
.modal{position:fixed;inset:0;background:rgba(22,37,44,.45);z-index:50;display:flex;
  align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:620px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0}
.sheet-h{padding:18px 20px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:#fff;
  display:flex;justify-content:space-between;align-items:center}
.sheet-b{padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet-f{padding:14px 20px;border-top:1px solid var(--rule);position:sticky;bottom:0;background:#fff;display:flex;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.center{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.banner{padding:11px 13px;border-radius:8px;font-size:13px;line-height:1.5;margin-bottom:12px}
.hidden{display:none!important}
@media(max-width:640px){
  .qator{flex-wrap:wrap}
  .g2{grid-template-columns:1fr}
  .acts{width:100%;justify-content:flex-start!important}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- KIRISH -->
<div id="gate" class="center">
  <div class="card" style="max-width:390px;width:100%;padding:28px">
    <div class="mono" style="font-size:11px;letter-spacing:.12em;color:var(--pine);margin-bottom:10px">QABUL JURNALI</div>
    <h1 class="disp" style="font-size:26px;margin:0;line-height:1.2">Bemorlar daftari</h1>
    <p id="gateText" style="font-size:14px;color:var(--soft);margin:10px 0 20px;line-height:1.5"></p>
    <input type="password" id="gateInput" placeholder="Kirish kodi" autocomplete="off">
    <div id="gateErr" style="color:var(--rose);font-size:13px;margin-top:8px"></div>
    <button id="gateBtn" class="btn btn-main" style="width:100%;margin-top:14px;padding:11px 0;font-size:14px"></button>
    <button id="setupBtn" class="btn" style="width:100%;margin-top:8px;padding:9px 0;font-size:13px">Baza sozlamalari</button>
  </div>
</div>

<!-- ASOSIY -->
<div id="app" class="hidden">
<header>
  <div class="wrap" style="padding-top:16px;padding-bottom:16px">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div>
        <div class="mono" style="font-size:10.5px;letter-spacing:.14em;color:var(--pine)" id="todayLbl"></div>
        <h1 class="disp" style="font-size:25px;margin:4px 0 0;letter-spacing:-.01em">Bemorlar daftari</h1>
      </div>
      <div class="row">
        <span id="saveState" class="mono" style="font-size:11px;color:var(--soft)"></span>
        <button class="btn" onclick="csvYukla()">Excel'ga yuklash</button>
        <button class="btn" onclick="sozlamaOch()">Sozlama</button>
        <button class="btn btn-main" onclick="yangiOch()">+ Yangi yozuv</button>
      </div>
    </div>
    <div class="row" style="margin-top:16px" id="stats"></div>
  </div>
</header>

<div class="wrap" style="padding-top:16px">
  <div id="banner"></div>
  <div class="row">
    <input id="qidiruv" placeholder="Ism, telefon, manzil yoki № bo'yicha qidirish" style="flex:1 1 240px;max-width:380px">
    <select id="fHolat" style="width:auto">
      <option value="hammasi">Barcha holatlar</option>
      <option value="kutilmoqda">Kutilmoqda</option>
      <option value="keldi">Keldi</option>
      <option value="kelmadi">Kelmadi</option>
    </select>
    <select id="fManba" style="width:auto"></select>
    <div style="display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden">
      <button class="btn" id="tabRoyxat" style="border:none;border-radius:0" onclick="korinish('royxat')">Ro'yxat</button>
      <button class="btn" id="tabStat" style="border:none;border-radius:0" onclick="korinish('stat')">Statistika</button>
    </div>
  </div>
</div>

<main class="wrap" style="padding-top:16px;padding-bottom:40px">
  <div id="list"></div>
  <div id="statView" class="card hidden" style="padding:20px"></div>
  <p id="modeNote" style="font-size:12px;color:var(--soft);margin-top:16px;line-height:1.5"></p>
</main>
</div>

<!-- FORMA -->
<div id="formModal" class="modal hidden">
  <div class="sheet">
    <div class="sheet-h">
      <h2 class="disp" id="formTitle" style="font-size:18px;margin:0"></h2>
      <button onclick="formYop()" style="background:none;border:none;font-size:22px;color:var(--soft);cursor:pointer;line-height:1">&times;</button>
    </div>
    <div class="sheet-b">
      <div><label class="lb">F.I.O. *</label><input id="f_fio" placeholder="Familiya Ism Otasining ismi"></div>
      <div class="g2">
        <div><label class="lb">Tug'ilgan sana</label><input type="date" id="f_tugilgan"><span id="yoshLbl" class="mono" style="font-size:12px;color:var(--pine)"></span></div>
        <div><label class="lb">Telefon</label><input id="f_tel" inputmode="tel" placeholder="+998 90 123 45 67"><span id="telOgoh" style="font-size:12px;color:var(--amber)"></span></div>
      </div>
      <div><label class="lb">Manzil</label><input id="f_manzil" placeholder="Viloyat, tuman, mahalla"></div>
      <div><label class="lb">Reja</label><input id="f_reja" placeholder="Konsultatsiya, UTT, operatsiya…"></div>
      <div class="g2">
        <div><label class="lb">Gaplashilgan sana</label><input type="date" id="f_gaplashilgan"></div>
        <div><label class="lb">Keladigan sana</label><input type="date" id="f_keladigan"></div>
      </div>
      <div class="g2">
        <div><label class="lb">Manba</label><select id="f_manba"></select></div>
        <div><label class="lb">Qayta aloqa sanasi</label><input type="date" id="f_qaytaAloqa"></div>
      </div>
      <div><label class="lb">Holat</label><div class="row" id="holatBtns" style="flex-wrap:nowrap"></div></div>
      <div><label class="lb">Izoh</label><textarea id="f_izoh" rows="3" placeholder="Qo'shimcha ma'lumot"></textarea></div>
    </div>
    <div class="sheet-f">
      <button class="btn" style="flex:1;padding:11px 0" onclick="formYop()">Bekor qilish</button>
      <button class="btn btn-main" style="flex:2;padding:11px 0;font-size:14px" onclick="saqla()">Saqlash</button>
    </div>
  </div>
</div>

<!-- SOZLAMA -->
<div id="setupModal" class="modal hidden">
  <div class="sheet" style="max-width:560px">
    <div class="sheet-h">
      <h2 class="disp" style="font-size:18px;margin:0">Baza sozlamalari</h2>
      <button onclick="sozlamaYop()" style="background:none;border:none;font-size:22px;color:var(--soft);cursor:pointer;line-height:1">&times;</button>
    </div>
    <div class="sheet-b">
      <p style="font-size:13.5px;color:var(--soft);margin:0;line-height:1.6">
        Bo'sh qoldirsangiz, yozuvlar <b>faqat shu qurilmada</b> saqlanadi.
        Barcha xodimlarda umumiy bo'lishi uchun bepul Supabase bazasini ulang —
        qo'llanma yonidagi <b>QOLLANMA.md</b> faylida.
      </p>
      <div><label class="lb">Supabase URL</label><input id="s_url" placeholder="https://xxxx.supabase.co"></div>
      <div><label class="lb">Anon key</label><input id="s_key" placeholder="eyJhbGci..."></div>
      <div><label class="lb">Kirish kodi</label><input id="s_kod" placeholder="Xodimlar uchun kod"></div>
      <div id="setupErr" style="font-size:13px;color:var(--rose)"></div>
      <div id="setupOk" style="font-size:13px;color:var(--emerald)"></div>
    </div>
    <div class="sheet-f">
      <button class="btn" style="flex:1;padding:11px 0" onclick="tozala()">Tozalash</button>
      <button class="btn" style="flex:1;padding:11px 0" onclick="sozlamaYop()">Yopish</button>
      <button class="btn btn-main" style="flex:2;padding:11px 0;font-size:14px" onclick="sozlamaSaqla()">Saqlash va tekshirish</button>
    </div>
  </div>
</div>

<!-- O'CHIRISH -->
<div id="delModal" class="modal hidden" style="align-items:center">
  <div class="card" style="max-width:340px;width:100%;padding:22px;margin:0 20px">
    <h3 class="disp" style="font-size:17px;margin:0 0 6px">Yozuv o'chirilsinmi?</h3>
    <p style="font-size:14px;color:var(--soft);margin:0 0 18px">Bu amalni qaytarib bo'lmaydi.</p>
    <div style="display:flex;gap:8px">
      <button class="btn" style="flex:1;padding:10px 0" onclick="delYop()">Bekor qilish</button>
      <button class="btn" style="flex:1;padding:10px 0;background:var(--rose);color:#fff;border:none;font-weight:600" onclick="delTasdiq()">O'chirish</button>
    </div>
  </div>
</div>

<script>
/* ═══════════ SOZLAMA ═══════════ */
const LS = "daftar2_v1";
const LS_CFG = "daftar2_cfg_v1";
const JADVAL = "bemorlar2";
const MANBA = ["Instagram","Telegram","Tanish orqali","Reklama","Google / Sayt","Qayta murojaat","Boshqa"];
const HOLAT = {
  kutilmoqda:{label:"Kutilmoqda",c:"var(--amber)",bg:"var(--amber-soft)",ic:"•"},
  keldi:{label:"Keldi",c:"var(--emerald)",bg:"var(--pine-soft)",ic:"✓"},
  kelmadi:{label:"Kelmadi",c:"var(--rose)",bg:"var(--rose-soft)",ic:"✕"}
};

let cfg = {url:"",key:"",kod:""};
let data = [];
let bulut = false;
let tahrirId = null, ochirishId = null, korinishRejim = "royxat";

/* ═══════════ YORDAMCHI ═══════════ */
const $ = id => document.getElementById(id);
const bugun = () => new Date().toISOString().slice(0,10);
const esc = s => String(s??"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

function sana(d){ if(!d) return "—"; const [y,m,g]=d.split("-"); return `${g}.${m}.${y}`; }

function yosh(d){
  if(!d) return ""; const t=new Date(d); if(isNaN(t)) return "";
  const n=new Date(); let y=n.getFullYear()-t.getFullYear();
  const m=n.getMonth()-t.getMonth();
  if(m<0||(m===0&&n.getDate()<t.getDate())) y--;
  return (y>=0&&y<130) ? y+" yosh" : "";
}

function telFormat(v){
  const r=v.replace(/\D/g,"").slice(0,12);
  if(r.length<=3) return r?"+"+r:"";
  if(r.length<=5) return `+${r.slice(0,3)} ${r.slice(3)}`;
  if(r.length<=8) return `+${r.slice(0,3)} ${r.slice(3,5)} ${r.slice(5)}`;
  if(r.length<=10) return `+${r.slice(0,3)} ${r.slice(3,5)} ${r.slice(5,8)} ${r.slice(8)}`;
  return `+${r.slice(0,3)} ${r.slice(3,5)} ${r.slice(5,8)} ${r.slice(8,10)} ${r.slice(10)}`;
}

function banner(matn,tur){
  const b=$("banner");
  if(!matn){ b.innerHTML=""; return; }
  const rang = tur==="xato" ? ["var(--rose-soft)","var(--rose)"] : ["var(--amber-soft)","var(--amber)"];
  b.innerHTML = `<div class="banner" style="background:${rang[0]};color:${rang[1]}">${esc(matn)}</div>`;
}

/* ═══════════ SAQLASH QATLAMI ═══════════ */
function cfgYukla(){
  try{ const c=JSON.parse(localStorage.getItem(LS_CFG)||"{}"); cfg={url:c.url||"",key:c.key||"",kod:c.kod||""}; }catch{}
}
function cfgSaqla(){ localStorage.setItem(LS_CFG, JSON.stringify(cfg)); }

async function sb(yol, opt={}){
  const r = await fetch(cfg.url.replace(/\/$/,"") + "/rest/v1/" + yol, {
    ...opt,
    headers:{ apikey:cfg.key, Authorization:"Bearer "+cfg.key,
      "Content-Type":"application/json", Prefer:"return=representation", ...(opt.headers||{}) }
  });
  if(!r.ok) throw new Error("Baza xatosi " + r.status + ": " + (await r.text()).slice(0,120));
  const t = await r.text();
  return t ? JSON.parse(t) : [];
}

async function yukla(){
  if(cfg.url && cfg.key){
    try{
      data = await sb(JADVAL + "?select=*&order=no.desc");
      bulut = true; banner("");
      localStorage.setItem(LS, JSON.stringify(data)); // zaxira
      return;
    }catch(e){
      bulut = false;
      banner("Bazaga ulanib bo'lmadi ("+e.message+"). Yozuvlar shu qurilmadan o'qilmoqda.","xato");
    }
  }
  try{ data = JSON.parse(localStorage.getItem(LS)||"[]"); }catch{ data=[]; }
}

async function yoz(yozuv, amal){
  // amal: qosh | yangila | ochir
  if(bulut){
    try{
      if(amal==="qosh") await sb(JADVAL, {method:"POST", body:JSON.stringify(yozuv)});
      if(amal==="yangila") await sb(JADVAL+"?id=eq."+encodeURIComponent(yozuv.id), {method:"PATCH", body:JSON.stringify(yozuv)});
      if(amal==="ochir") await sb(JADVAL+"?id=eq."+encodeURIComponent(yozuv.id), {method:"DELETE"});
      banner("");
    }catch(e){
      banner("Bazaga yozilmadi ("+e.message+"). Ma'lumot shu qurilmada saqlandi.","xato");
    }
  }
  localStorage.setItem(LS, JSON.stringify(data));
  holatKorsat();
}

function holatKorsat(){
  $("saveState").textContent = bulut ? "" : "";
  $("modeNote").textContent = bulut
    ? "Yozuvlar umumiy bazada — barcha xodimlarda bir xil ko'rinadi."
    : "Yozuvlar faqat shu qurilmada saqlanmoqda. Umumiy bo'lishi uchun «Sozlama» dan bazani ulang.";
}

/* ═══════════ KIRISH ═══════════ */
function gateKorsat(){
  const yoq = !cfg.kod;
  $("gateText").textContent = yoq
    ? "Kirish kodini o'rnating. Faqat shu kodni bilgan xodimlar daftarni ocha oladi."
    : "Davom etish uchun kirish kodini kiriting.";
  $("gateBtn").textContent = yoq ? "Kodni o'rnatish" : "Kirish";
  $("gateInput").placeholder = yoq ? "Yangi kod" : "Kirish kodi";
  $("setupBtn").textContent = yoq ? "Baza sozlamalari" : "Sozlamalarni o'zgartirish";
}

$("gateBtn").onclick = async () => {
  const v = $("gateInput").value.trim();
  if(!cfg.kod){
    if(v.length < 4){ $("gateErr").textContent = "Kod kamida 4 ta belgidan iborat bo'lsin."; return; }
    cfg.kod = v; cfgSaqla(); await kir();
  } else {
    if(v === cfg.kod){ await kir(); }
    else $("gateErr").textContent = "Kod noto'g'ri.";
  }
};
$("gateInput").addEventListener("keydown", e => { if(e.key==="Enter") $("gateBtn").click(); });
$("gateInput").addEventListener("input", () => $("gateErr").textContent = "");
$("setupBtn").onclick = sozlamaOch;

async function kir(){
  $("gate").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("todayLbl").textContent = "QABUL JURNALI · " + sana(bugun());
  await yukla();
  holatKorsat();
  chiz();
}

/* ═══════════ RO'YXAT ═══════════ */
function filtrlangan(){
  const q = $("qidiruv").value.trim().toLowerCase();
  const h = $("fHolat").value, m = $("fManba").value;
  return data.filter(y=>{
    if(h!=="hammasi" && y.holat!==h) return false;
    if(m!=="hammasi" && y.manba!==m) return false;
    if(!q) return true;
    return [y.fio,y.manzil,y.tel,y.reja,y.manba,y.izoh,y.no].join(" ").toLowerCase().includes(q);
  }).sort((a,b)=>(b.no||0)-(a.no||0));
}

function chiz(){
  // statistika
  const b = bugun();
  const kut = data.filter(y=>y.holat==="kutilmoqda");
  const s = {
    bugun: kut.filter(y=>y.keladigan===b).length,
    kechikkan: kut.filter(y=>y.keladigan && y.keladigan<b).length,
    qayta: data.filter(y=>y.qaytaAloqa && y.qaytaAloqa<=b && y.holat==="kutilmoqda").length,
    keldi: data.filter(y=>y.holat==="keldi").length,
    jami: data.length
  };
  $("stats").innerHTML = [
    ["Bugun kutilmoqda",s.bugun,"var(--pine)"],
    ["Kechikkan",s.kechikkan,"var(--rose)"],
    ["Qayta aloqa",s.qayta,"var(--amber)"],
    ["Keldi",s.keldi,"var(--emerald)"],
    ["Jami",s.jami,"var(--soft)"]
  ].map(([n,v,c])=>`<div class="chip"><b style="color:${c}">${v}</b><span>${n}</span></div>`).join("");

  $("tabRoyxat").style.background = korinishRejim==="royxat" ? "var(--pine)" : "#fff";
  $("tabRoyxat").style.color = korinishRejim==="royxat" ? "#fff" : "var(--soft)";
  $("tabStat").style.background = korinishRejim==="stat" ? "var(--pine)" : "#fff";
  $("tabStat").style.color = korinishRejim==="stat" ? "#fff" : "var(--soft)";
  $("list").classList.toggle("hidden", korinishRejim!=="royxat");
  $("statView").classList.toggle("hidden", korinishRejim!=="stat");

  if(korinishRejim==="stat"){ chizStat(); return; }

  const r = filtrlangan();
  if(!r.length){
    $("list").innerHTML = `<div class="card" style="padding:44px;text-align:center">
      <p class="disp" style="font-size:17px;margin:0 0 6px">${data.length?"Bunday yozuv topilmadi":"Daftar hali bo'sh"}</p>
      <p style="font-size:14px;color:var(--soft);margin:0 0 16px">${data.length?"Qidiruv yoki filtrni o'zgartirib ko'ring.":"Birinchi qo'ng'iroqni yozib qo'ying — № avtomatik qo'yiladi."}</p>
      ${data.length?"":'<button class="btn btn-main" onclick="yangiOch()">+ Yangi yozuv</button>'}</div>`;
    return;
  }

  $("list").innerHTML = `<div class="card" style="overflow:hidden">` + r.map(y=>{
    const h = HOLAT[y.holat]||HOLAT.kutilmoqda;
    const kech = y.holat==="kutilmoqda" && y.keladigan && y.keladigan<b;
    const bug  = y.holat==="kutilmoqda" && y.keladigan===b;
    const chiziq = bug?"var(--pine)":kech?"var(--rose)":"transparent";
    return `<div class="qator" style="border-left:3px solid ${chiziq}">
      <div class="mono" style="font-size:15px;font-weight:600;color:var(--soft);min-width:34px;padding-top:2px">${String(y.no).padStart(3,"0")}</div>
      <div style="flex:1;min-width:0">
        <div class="row" style="gap:8px;margin-bottom:5px">
          <span class="disp" style="font-size:16px;font-weight:500">${esc(y.fio)}</span>
          ${y.tugilgan?`<span class="mono" style="font-size:11.5px;color:var(--soft)">${sana(y.tugilgan)} · ${yosh(y.tugilgan)}</span>`:""}
          <span class="tag" style="background:${h.bg};color:${h.c}">${h.label}</span>
          ${bug?`<span class="tag" style="background:var(--pine-soft);color:var(--pine)">Bugun</span>`:""}
          ${kech?`<span class="tag" style="background:var(--rose-soft);color:var(--rose)">Kechikkan</span>`:""}
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:3px 20px;font-size:13px;color:var(--soft)">
          ${y.tel?`<a href="tel:${esc(y.tel.replace(/\s/g,""))}" class="mono" style="color:var(--pine);text-decoration:none;font-weight:500">${esc(y.tel)}</a>`:""}
          ${y.manzil?`<span>${esc(y.manzil)}</span>`:""}
          ${y.reja?`<span><b style="color:var(--ink);font-weight:500">Reja:</b> ${esc(y.reja)}</span>`:""}
          ${y.manba?`<span>Manba: ${esc(y.manba)}</span>`:""}
        </div>
        <div class="mono" style="display:flex;flex-wrap:wrap;gap:3px 18px;font-size:12px;color:var(--soft);margin-top:4px">
          ${y.gaplashilgan?`<span>Gaplashildi: ${sana(y.gaplashilgan)}</span>`:""}
          ${y.keladigan?`<span>Keladi: ${sana(y.keladigan)}</span>`:""}
          ${y.qaytaAloqa?`<span style="color:var(--amber)">Qayta aloqa: ${sana(y.qaytaAloqa)}</span>`:""}
        </div>
        ${y.izoh?`<div style="font-size:13px;color:var(--soft);margin-top:5px;font-style:italic">${esc(y.izoh)}</div>`:""}
      </div>
      <div class="acts" style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
        <div style="display:flex;gap:4px">
          ${Object.entries(HOLAT).map(([k,v])=>`<button title="${v.label}" onclick="holatOzgart('${y.id}','${k}')"
            style="width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;
            border:1px solid ${y.holat===k?v.c:"var(--rule)"};background:${y.holat===k?v.c:"#fff"};
            color:${y.holat===k?"#fff":"var(--soft)"}">${v.ic}</button>`).join("")}
        </div>
        <div style="display:flex;gap:4px">
          <button class="btn btn-sm" onclick="tahrirOch('${y.id}')">Tahrir</button>
          <button class="btn btn-sm" style="color:var(--rose)" onclick="delOch('${y.id}')">O'chirish</button>
        </div>
      </div>
    </div>`;
  }).join("") + `</div>`;
}

function chizStat(){
  const m = {};
  data.forEach(y=>{
    const k = y.manba || "Ko'rsatilmagan";
    if(!m[k]) m[k] = {jami:0,keldi:0};
    m[k].jami++; if(y.holat==="keldi") m[k].keldi++;
  });
  const arr = Object.entries(m).map(([nom,v])=>({nom,...v,foiz:v.jami?Math.round(v.keldi/v.jami*100):0}))
    .sort((a,b)=>b.jami-a.jami);
  $("statView").innerHTML = `<h2 class="disp" style="font-size:17px;margin:0 0 4px">Manba bo'yicha samaradorlik</h2>
    <p style="font-size:13px;color:var(--soft);margin:0 0 18px">Qaysi kanal haqiqatan bemor keltiryapti — reklama byudjetini shunga qarab taqsimlang.</p>` +
    (arr.length ? arr.map(x=>`<div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px">
        <span style="font-size:14px;font-weight:500">${esc(x.nom)}</span>
        <span class="mono" style="font-size:12.5px;color:var(--soft)">${x.keldi}/${x.jami} keldi · <b style="color:var(--pine)">${x.foiz}%</b></span>
      </div>
      <div style="height:7px;background:var(--paper);border-radius:4px;overflow:hidden">
        <div style="width:${x.foiz}%;height:100%;background:var(--pine);border-radius:4px"></div>
      </div></div>`).join("")
    : `<p style="font-size:14px;color:var(--soft)">Hozircha ma'lumot yo'q.</p>`);
}

function korinish(k){ korinishRejim = k; chiz(); }

/* ═══════════ FORMA ═══════════ */
const MAYDON = ["fio","tugilgan","manzil","reja","gaplashilgan","keladigan","manba","qaytaAloqa","tel","izoh"];
let formHolat = "kutilmoqda";

function holatBtnChiz(){
  $("holatBtns").innerHTML = Object.entries(HOLAT).map(([k,v])=>
    `<button onclick="formHolatSet('${k}')" style="flex:1;padding:9px 0;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;
      border:1px solid ${formHolat===k?v.c:"var(--rule)"};background:${formHolat===k?v.bg:"#fff"};
      color:${formHolat===k?v.c:"var(--soft)"}">${v.label}</button>`).join("");
}
function formHolatSet(k){ formHolat = k; holatBtnChiz(); }

function yangiOch(){
  tahrirId = null; formHolat = "kutilmoqda";
  MAYDON.forEach(k => $("f_"+k).value = "");
  $("f_gaplashilgan").value = bugun();
  $("formTitle").textContent = "Yangi yozuv";
  $("yoshLbl").textContent = ""; $("telOgoh").textContent = "";
  holatBtnChiz();
  $("formModal").classList.remove("hidden");
  $("f_fio").focus();
}

function tahrirOch(id){
  const y = data.find(x=>x.id===id); if(!y) return;
  tahrirId = id; formHolat = y.holat || "kutilmoqda";
  MAYDON.forEach(k => $("f_"+k).value = y[k] || "");
  $("formTitle").textContent = "Yozuvni tahrirlash";
  $("yoshLbl").textContent = yosh(y.tugilgan); $("telOgoh").textContent = "";
  holatBtnChiz();
  $("formModal").classList.remove("hidden");
}

function formYop(){ $("formModal").classList.add("hidden"); }

async function saqla(){
  const fio = $("f_fio").value.trim();
  if(!fio){ $("f_fio").focus(); return; }
  const obj = {holat: formHolat};
  MAYDON.forEach(k => obj[k] = $("f_"+k).value.trim());
  obj.fio = fio;

  if(tahrirId){
    const i = data.findIndex(x=>x.id===tahrirId);
    data[i] = {...data[i], ...obj};
    await yoz(data[i], "yangila");
  }else{
    const no = data.reduce((m,y)=>Math.max(m, Number(y.no)||0), 0) + 1;
    const yangi = {...obj, id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), no};
    data.unshift(yangi);
    await yoz(yangi, "qosh");
  }
  formYop(); chiz();
}

async function holatOzgart(id,h){
  const i = data.findIndex(x=>x.id===id); if(i<0) return;
  data[i].holat = h;
  await yoz(data[i], "yangila");
  chiz();
}

function delOch(id){ ochirishId = id; $("delModal").classList.remove("hidden"); }
function delYop(){ ochirishId = null; $("delModal").classList.add("hidden"); }
async function delTasdiq(){
  const y = data.find(x=>x.id===ochirishId);
  data = data.filter(x=>x.id!==ochirishId);
  if(y) await yoz(y, "ochir");
  delYop(); chiz();
}

/* ═══════════ SOZLAMA ═══════════ */
function sozlamaOch(){
  $("s_url").value = cfg.url; $("s_key").value = cfg.key; $("s_kod").value = cfg.kod;
  $("setupErr").textContent = ""; $("setupOk").textContent = "";
  $("setupModal").classList.remove("hidden");
}
function sozlamaYop(){ $("setupModal").classList.add("hidden"); }
function tozala(){
  if(!confirm("Kirish kodi va baza sozlamalari o'chirilsinmi? Bazadagi yozuvlar saqlanib qoladi.")) return;
  localStorage.removeItem(LS_CFG);
  cfg = {url:"",key:"",kod:""};
  location.reload();
}

async function sozlamaSaqla(){
  cfg.url = $("s_url").value.trim();
  cfg.key = $("s_key").value.trim();
  cfg.kod = $("s_kod").value.trim();
  cfgSaqla();
  $("setupErr").textContent = ""; $("setupOk").textContent = "";
  if(cfg.url && cfg.key){
    try{
      await sb(JADVAL + "?select=id&limit=1");
      bulut = true;
      $("setupOk").textContent = "Bazaga muvaffaqiyatli ulandi ✓";
      await yukla();
    }catch(e){
      bulut = false;
      $("setupErr").textContent = e.message;
    }
  }else{
    bulut = false;
    $("setupOk").textContent = "Saqlandi. Yozuvlar shu qurilmada turadi.";
  }
  gateKorsat(); holatKorsat();
  if(!$("app").classList.contains("hidden")) chiz();
}

/* ═══════════ CSV ═══════════ */
function csvYukla(){
  const sar = ["No","FIO","Tugilgan","Manzil","Reja","Gaplashilgan","Keladigan","Manba","Qayta aloqa","Holat","Telefon","Izoh"];
  const q = filtrlangan().map(y=>[y.no,y.fio,y.tugilgan,y.manzil,y.reja,y.gaplashilgan,
    y.keladigan,y.manba,y.qaytaAloqa,(HOLAT[y.holat]||{}).label,y.tel,y.izoh]);
  const csv = "\uFEFF" + [sar,...q].map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(";")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download = "bemorlar-" + bugun() + ".csv";
  a.click();
}

/* ═══════════ ISHGA TUSHIRISH ═══════════ */
$("f_tugilgan").addEventListener("input", e => $("yoshLbl").textContent = yosh(e.target.value));
$("f_tel").addEventListener("input", e => {
  e.target.value = telFormat(e.target.value);
  const t = e.target.value.replace(/\D/g,"");
  const bor = t.length>8 && data.find(y => (y.tel||"").replace(/\D/g,"")===t && y.id!==tahrirId);
  $("telOgoh").textContent = bor ? `Bu raqam bor: ${bor.fio} (№${bor.no})` : "";
});
["qidiruv","fHolat","fManba"].forEach(id => $(id).addEventListener("input", chiz));

$("f_manba").innerHTML = `<option value="">Tanlanmagan</option>` + MANBA.map(m=>`<option>${m}</option>`).join("");
$("fManba").innerHTML = `<option value="hammasi">Barcha manbalar</option>` + MANBA.map(m=>`<option>${m}</option>`).join("");

[["formModal",formYop],["setupModal",sozlamaYop],["delModal",delYop]].forEach(([id,fn])=>{
  $(id).addEventListener("click", e => { if(e.target.id===id) fn(); });
});
document.addEventListener("keydown", e => {
  if(e.key==="Escape"){ formYop(); sozlamaYop(); delYop(); }
});

cfgYukla();
gateKorsat();
$("gateInput").focus();
</script>
</body>
